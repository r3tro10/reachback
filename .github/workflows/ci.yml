name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Install dependencies
        run: npm ci

      - name: Lint API
        run: npm run lint -w apps/api

      - name: Lint Web
        run: npm run lint -w apps/web

      - name: Build Web
        run: npm run build -w apps/web
        env:
          NEXT_PUBLIC_API_URL: http://localhost:3001

  security:
    runs-on: ubuntu-latest
    # Skipped until a SNYK_TOKEN repo secret is added (Settings > Secrets and variables > Actions).
    # https://docs.snyk.io/getting-started/how-to-get-your-snyk-api-token
    if: ${{ secrets.SNYK_TOKEN != '' }}

    steps:
      - uses: actions/checkout@v3

      - name: Run Snyk security scan
        uses: snyk/actions/node@master
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
